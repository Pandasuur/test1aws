<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 193 53" width="193" height="53">
  <style>
    .bg { fill: #0f172a; }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 24px; fill: #ffffff; letter-spacing: 2px; }
    .text-sub { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 7px; fill: #38bdf8; letter-spacing: 3px; }
  </style>
  
  <!-- Fondo opcional para contraste (puedes eliminar la etiqueta rect si prefieres fondo transparente) -->
  <rect width="193" height="53" rx="6" class="bg"/>

  <!-- Icono isotipo minimalista de viajes (Avión y órbita) -->
  <g transform="translate(14, 6) scale(0.35)">
    <circle cx="58" cy="58" r="54" fill="none" stroke="#38bdf8" stroke-width="6"/>
    <path d="M20 58h76M58 20c15 15 15 61 0 76" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.4"/>
    <path d="M35 55l45-22-15 40-10-15-15-3z" fill="#0ea5e9"/>
  </g>

  <!-- Tipografía del logotipo -->
  <text x="62" y="32" class="text-title">PILCO</text>
  <text x="64" y="43" class="text-sub">VIAJES Y AVENTURAS</text>
</svg>
